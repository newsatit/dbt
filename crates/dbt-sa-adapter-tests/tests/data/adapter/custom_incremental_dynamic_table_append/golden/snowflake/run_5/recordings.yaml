model.test.events_enriched:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_enriched__dbt_tmp
    as (
    select * from (
    
    
    -- Stream-static join: each new event with its campaign's label at the time it arrives.
    select e.event_id, e.campaign_id, c.label
    from development.adapters_snowflake_custom_incremental_dynamic_table_append.events changes(information => APPEND_ONLY) at(offset => 0) as e
    left join development.adapters_snowflake_custom_incremental_dynamic_table_append.campaigns as c
    on c.campaign_id = e.campaign_id
    ) limit 0
    )
- sequence: 2
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_enriched__dbt_tmp
- sequence: 3
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_append.events_enriched__dbt_tmp cascade
- sequence: 4
  type: execute
  sql: |-
    create or replace dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_enriched ("EVENT_ID" NUMBER(38,0), "CAMPAIGN_ID" NUMBER(38,0), "LABEL" character varying(16))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    
    refresh using (
    insert into SELF ("EVENT_ID", "CAMPAIGN_ID", "LABEL")
    select "EVENT_ID", "CAMPAIGN_ID", "LABEL"
    from (
    
    
    -- Stream-static join: each new event with its campaign's label at the time it arrives.
    select e.event_id, e.campaign_id, c.label
    from development.adapters_snowflake_custom_incremental_dynamic_table_append.events changes(information => APPEND_ONLY) as e
    left join development.adapters_snowflake_custom_incremental_dynamic_table_append.campaigns as c
    on c.campaign_id = e.campaign_id
    ) as DBT_INTERNAL_SOURCE
    )
- sequence: 5
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_enriched refresh
- sequence: 6
  type: execute
  sql: use warehouse [MASKED_WH]
model.test.events_switch:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_switch__dbt_tmp
    as (
    select * from (
    
    select e.event_id, e.campaign_id
    from development.adapters_snowflake_custom_incremental_dynamic_table_append.events changes(information => APPEND_ONLY) at(offset => 0) as e
    ) limit 0
    )
- sequence: 2
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_switch__dbt_tmp
- sequence: 3
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_append.events_switch__dbt_tmp cascade
- sequence: 4
  type: execute
  sql: |-
    create or replace dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_switch ("EVENT_ID" NUMBER(38,0), "CAMPAIGN_ID" NUMBER(38,0))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    select e.event_id, e.campaign_id
    from development.adapters_snowflake_custom_incremental_dynamic_table_append.events changes(information => APPEND_ONLY) as e
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.event_id = DBT_INTERNAL_SOURCE.event_id
    when matched then update set "EVENT_ID" = DBT_INTERNAL_SOURCE."EVENT_ID", "CAMPAIGN_ID" = DBT_INTERNAL_SOURCE."CAMPAIGN_ID"
    when not matched then insert ("EVENT_ID", "CAMPAIGN_ID") values (DBT_INTERNAL_SOURCE."EVENT_ID", DBT_INTERNAL_SOURCE."CAMPAIGN_ID")
    )
- sequence: 5
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_switch refresh
- sequence: 6
  type: execute
  sql: use warehouse [MASKED_WH]
