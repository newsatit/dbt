model.test.deleted_users:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: show dynamic tables like 'DELETED_USERS' in schema "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE_APPEND"
- sequence: 2
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_append.deleted_users__dbt_tmp
    as (
    select * from (
    
    
    -- Audit log: users deleted from the source, kept across --full-refresh.
    select user_id, user_name
    from development.adapters_snowflake_custom_incremental_dynamic_table_append.users changes(information => DEFAULT) at(offset => 0)
    where metadata$action = 'DELETE'
    and not metadata$isupdate
    ) limit 0
    )
- sequence: 3
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_append.deleted_users__dbt_tmp
- sequence: 4
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_append.deleted_users__dbt_tmp cascade
- sequence: 5
  type: execute
  sql: |-
    create or alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_append.deleted_users ("USER_ID" NUMBER(38,0), "USER_NAME" character varying(16))
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    scheduler = 'DISABLE'
    
    
    
    
    
    refresh using (
    insert into SELF ("USER_ID", "USER_NAME")
    
    
    -- Audit log: users deleted from the source, kept across --full-refresh.
    select user_id, user_name
    from development.adapters_snowflake_custom_incremental_dynamic_table_append.users changes(information => DEFAULT)
    where metadata$action = 'DELETE'
    and not metadata$isupdate
    )
- sequence: 6
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_append.deleted_users refresh
- sequence: 7
  type: execute
  sql: use warehouse [MASKED_WH]
