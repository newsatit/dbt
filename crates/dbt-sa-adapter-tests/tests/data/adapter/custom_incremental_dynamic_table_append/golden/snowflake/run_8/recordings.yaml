  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_append.events_enriched__dbt_tmp
    as (
    select * from (
    
    
    -- Stream-static join: each new event with its campaign's label at the time it arrives.
    select e.event_id, e.campaign_id, c.label
