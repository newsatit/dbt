model.test.orders_merge:
- sequence: 0
  type: execute
  sql: use warehouse [MASKED_WH]
- sequence: 1
  type: execute
  sql: SHOW OBJECTS IN SCHEMA "DEVELOPMENT"."ADAPTERS_SNOWFLAKE_CUSTOM_INCREMENTAL_DYNAMIC_TABLE_SAMPLE" LIMIT 10000
- sequence: 2
  type: execute
  sql: |-
    create or replace temporary table development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders_merge__dbt_tmp
    as (
    select * from (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select o.order_id, o.ordered_at
    from (select * from development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders changes(information => DEFAULT) at(offset => 0) where ordered_at >= to_timestamp_tz('2025-01-01T00:00:00+00:00') and ordered_at < to_timestamp_tz('2025-01-03T00:00:00+00:00')) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) limit 0
    )
- sequence: 3
  type: execute
  sql: describe table development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders_merge__dbt_tmp
- sequence: 4
  type: execute
  sql: drop table if exists development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders_merge__dbt_tmp cascade
- sequence: 5
  type: execute
  sql: |-
    create dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders_merge ("ORDER_ID" NUMBER(38,0), "ORDERED_AT" TIMESTAMP_TZ)
    
    warehouse = [MASKED_WH]
    
    
    refresh_mode = CUSTOM_INCREMENTAL
    
    initialize = ON_CREATE
    
    
    scheduler = 'DISABLE'
    
    
    
    
    
    
    
    
    
    refresh using (
    merge into SELF as DBT_INTERNAL_DEST
    using (
    
    
    -- An update arrives as a DELETE and an INSERT of the same key; keep the INSERT.
    select o.order_id, o.ordered_at
    from (select * from development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders changes(information => DEFAULT) where ordered_at >= to_timestamp_tz('2025-01-01T00:00:00+00:00') and ordered_at < to_timestamp_tz('2025-01-03T00:00:00+00:00')) as o
    qualify row_number() over (
    partition by o.order_id
    order by case when o.METADATA$ACTION = 'INSERT' then 0 else 1 end
    ) = 1
    ) as DBT_INTERNAL_SOURCE
    on DBT_INTERNAL_DEST.order_id = DBT_INTERNAL_SOURCE.order_id
    when matched then update set "ORDER_ID" = DBT_INTERNAL_SOURCE."ORDER_ID", "ORDERED_AT" = DBT_INTERNAL_SOURCE."ORDERED_AT"
    when not matched then insert ("ORDER_ID", "ORDERED_AT") values (DBT_INTERNAL_SOURCE."ORDER_ID", DBT_INTERNAL_SOURCE."ORDERED_AT")
    )
- sequence: 6
  type: execute
  sql: alter dynamic table development.adapters_snowflake_custom_incremental_dynamic_table_sample.orders_merge refresh
